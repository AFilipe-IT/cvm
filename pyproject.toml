[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `caspar` alone is taken on PyPI by an empty placeholder (v0.0.0, uploaded
# 2025-12-12), so the distribution is `cvm-caspar`: the methodology first, the
# reference implementation second. The installed command stays `caspar` — the
# usual arrangement when a distribution name and its entry point differ
# (`pip install ansible-core` gives you `ansible`).
name = "cvm-caspar"
version = "1.0.0"
description = "CVM — Configuration Vulnerability Meter: quantitative, reproducible security configuration scoring (CCSS / NISTIR 7502). CASPAR is the reference implementation."
readme = "README_PYPI.md"
# No `license` field on purpose: the repository carries no LICENSE file yet, and
# declaring one here would be a claim the repository does not back. Add both
# together (the file and this field) when the licence is chosen — without it,
# PyPI shows the package as unlicensed, which legally means "all rights
# reserved" and stops others from using it.
keywords =["security", "configuration", "hardening", "ccss", "cis-benchmark",
            "stig", "vulnerability", "compliance", "devsecops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",   # IaC: Kubernetes manifest parsing (yaml_flat)
    # Phase 2+ dependencies (uncomment when needed):
    # "llama-index>=0.10",
    # "anthropic>=0.25",
    # "openpyxl>=3.1",
    # "pyparsing>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # The API test modules import fastapi.testclient at module level, so the
    # suite cannot even be collected without these. Keeping them out of [dev]
    # made `pip install -e ".[dev]" && pytest` fail on a clean machine.
    "fastapi>=0.110",
    "httpx>=0.27",              # required by fastapi.testclient
    "python-multipart>=0.0.9",  # UploadFile/Form support (POST /scans/upload)
]
publish = [
    "requests>=2.31",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",  # UploadFile/Form support (POST /scans/upload)
]

[project.urls]
Homepage = "https://github.com/AFilipe-IT/cvm"
Repository = "https://github.com/AFilipe-IT/cvm"
Issues = "https://github.com/AFilipe-IT/cvm/issues"

[project.scripts]
caspar = "cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so 'from config_assessment.xxx import' works without install
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["config_assessment", "cli"]

# The built consoles live outside both Python packages, so they are not picked
# up by `packages` and have to be placed explicitly. Without them a
# `pip install` gets a `caspar serve` that hosts the REST API with no console at
# all — and, having no repository, no way to obtain one.
#
# The paths on the right mirror the source tree because that is where
# _mount_frontend (cli/commands/serve_cmds.py) looks: it resolves
# <package-root>/frontend-v2/dist and <package-root>/frontend/dist, which is the
# repository root in a source checkout and site-packages in an installed wheel.
#
# ~2 MB of the ~2.8 MB wheel. The alternative is a console that exists only for
# people who clone the repository, which is the audience least in need of it.
[tool.hatch.build.targets.wheel.force-include]
"frontend-v2/dist" = "frontend-v2/dist"
"frontend/dist" = "frontend/dist"

# The sdist is the reproducibility artefact: it must carry the sources the wheel
# is built from (both consoles' src/, the canonical SQL) so the build can be
# repeated, not just the outputs.
[tool.hatch.build.targets.sdist]
include = [
    "cli/", "config_assessment/", "tests/",
    "frontend/", "frontend-v2/",
    "data/ccss_canonical.sql",
    "docs/", "pyproject.toml",
    "install-native.sh", "docker/",
    # Named individually rather than `*.md`: the glob also swept in the v2
    # planning documents (PLANO_V2, PRD, CONTRATO_API_V2, PROMPT_LOVABLE) and
    # two stray directory READMEs. They are working notes, not something to
    # publish to PyPI under this project's name.
    "README.md", "README_PYPI.md", "INSTALL.md",
]
exclude = [
    "**/node_modules/",
    "**/*.pdf",          # benchmark PDFs are build-time only; 78 MB for one
    "**/__pycache__/",
    "vm/",               # notes on the local QEMU validation VM; links to
                         # PLANO_V2.md, which is not published either
]
